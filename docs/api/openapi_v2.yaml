openapi: 3.1.0
info:
  title: Trampolin Backend API
  version: 0.2.0
  description: 'API-контракт для платформы «Трамплин».

    '
servers:
- url: /api/v1
tags:
- name: auth
- name: me
- name: applicant-profile
- name: employer-profile
- name: privacy-settings
- name: opportunities
- name: applications
- name: event-registrations
- name: tags
- name: favorites
- name: contacts
- name: curator
- name: admin
- name: public-opportunities
- name: employer-dashboard
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OpportunityId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ApplicationId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VerificationRequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ContactId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    EmployerProfileId:
      name: employerProfileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ApplicantProfileId:
      name: applicantProfileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    EmployerProfilePathId:
      name: employerProfileId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: forbidden
            message:
              type: string
              example: Employer is not verified
            details:
              nullable: true
    PaginatedOpportunityList:
      type: object
      required:
      - items
      - page
      - perPage
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpportunitySummary'
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    PaginatedApplicationList:
      type: object
      required:
      - items
      - page
      - perPage
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Application'
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    Role:
      type: string
      enum:
      - applicant
      - employer
      - curator
      - admin_curator
    VerificationStatus:
      type: string
      enum:
      - pending
      - verified
      - rejected
    VerificationRequestStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
    OpportunityType:
      type: string
      enum:
      - internship
      - vacancy
      - mentoring
      - event
    WorkFormat:
      type: string
      enum:
      - office
      - hybrid
      - remote
    EmploymentType:
      type: string
      enum:
      - full_time
      - part_time
      - project
    Level:
      type: string
      enum:
      - intern
      - junior
      - middle
      - senior
    PublicationStatus:
      type: string
      enum:
      - draft
      - pending_moderation
      - active
      - planned
      - closed
      - rejected
    ApplicationStatus:
      type: string
      enum:
      - pending
      - accepted
      - rejected
      - reserve
    EventRegistrationStatus:
      type: string
      enum:
      - registered
      - cancelled
    ContactStatus:
      type: string
      enum:
      - pending
      - accepted
      - rejected
      - blocked
    TagType:
      type: string
      enum:
      - technology
      - level
      - employment
      - category
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - displayName
      - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
        role:
          type: string
          enum:
          - applicant
          - employer
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required:
      - accessToken
      - refreshToken
      - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/MeResponse'
    MeResponse:
      type: object
      required:
      - id
      - email
      - displayName
      - role
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    EmployerProfile:
      type: object
      required:
      - id
      - userId
      - companyName
      - verificationStatus
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        companyName:
          type: string
        shortDescription:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
        websiteUrl:
          type: string
          format: uri
          nullable: true
        socialLinks:
          type: array
          items:
            type: string
            format: uri
        officePhotos:
          type: array
          items:
            type: string
            format: uri
        promoVideoUrl:
          type: string
          format: uri
          nullable: true
        cityId:
          type: integer
          format: int64
          nullable: true
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        verificationComment:
          type: string
          nullable: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
    EmployerProfileUpdateRequest:
      type: object
      properties:
        companyName:
          type: string
        shortDescription:
          type: string
        industry:
          type: string
        websiteUrl:
          type: string
          format: uri
        socialLinks:
          type: array
          items:
            type: string
            format: uri
        officePhotos:
          type: array
          items:
            type: string
            format: uri
        promoVideoUrl:
          type: string
          format: uri
        cityId:
          type: integer
          format: int64
    ApplicantProfile:
      type: object
      required:
      - id
      - userId
      - fullName
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        fullName:
          type: string
        university:
          type: string
          nullable: true
        studyCourse:
          type: string
          nullable: true
        graduationYear:
          type: integer
          nullable: true
        about:
          type: string
          nullable: true
        resumeText:
          type: string
          nullable: true
        portfolioLinks:
          type: array
          items:
            type: string
            format: uri
        skills:
          type: array
          items:
            type: string
    ApplicantProfileUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        university:
          type: string
        studyCourse:
          type: string
        graduationYear:
          type: integer
        about:
          type: string
        resumeText:
          type: string
        portfolioLinks:
          type: array
          items:
            type: string
            format: uri
    PrivacySettings:
      type: object
      required:
      - resumeVisibleToContacts
      - resumeVisibleToAllAuth
      - applicationsVisibleToContacts
      - applicationsVisibleToAllAuth
      - profileVisibleToAllAuth
      properties:
        resumeVisibleToContacts:
          type: boolean
        resumeVisibleToAllAuth:
          type: boolean
        applicationsVisibleToContacts:
          type: boolean
        applicationsVisibleToAllAuth:
          type: boolean
        profileVisibleToAllAuth:
          type: boolean
    OpportunitySummary:
      type: object
      required:
      - id
      - title
      - opportunityType
      - workFormat
      - publicationStatus
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        shortDescription:
          type: string
          nullable: true
        employerProfileId:
          type: integer
          format: int64
        employerName:
          type: string
          nullable: true
        opportunityType:
          $ref: '#/components/schemas/OpportunityType'
        workFormat:
          $ref: '#/components/schemas/WorkFormat'
        publicationStatus:
          $ref: '#/components/schemas/PublicationStatus'
        cityId:
          type: integer
          format: int64
          nullable: true
        addressId:
          type: integer
          format: int64
          nullable: true
        eventDate:
          type: string
          format: date-time
          nullable: true
        salaryFrom:
          type: integer
          nullable: true
        salaryTo:
          type: integer
          nullable: true
        tagIds:
          type: array
          items:
            type: integer
            format: int64
        cityName:
          type: string
          nullable: true
        addressText:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        isFavorite:
          type: boolean
          nullable: true
    OpportunityDetails:
      allOf:
      - $ref: '#/components/schemas/OpportunitySummary'
      - type: object
        properties:
          fullDescription:
            type: string
            nullable: true
          employmentType:
            $ref: '#/components/schemas/EmploymentType'
          level:
            $ref: '#/components/schemas/Level'
          publishedAt:
            type: string
            format: date-time
            nullable: true
          expiresAt:
            type: string
            format: date-time
            nullable: true
          eventDate:
            type: string
            format: date-time
            nullable: true
          contactInfo:
            type: object
            additionalProperties: true
          resourceLinks:
            type: array
            items:
              type: string
              format: uri
          media:
            type: array
            items:
              type: string
              format: uri
    OpportunityCreateRequest:
      type: object
      required:
      - title
      - shortDescription
      - fullDescription
      - opportunityType
      - workFormat
      - contactInfo
      - tagIds
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        shortDescription:
          type: string
          minLength: 10
          maxLength: 1000
        fullDescription:
          type: string
          minLength: 30
        opportunityType:
          $ref: '#/components/schemas/OpportunityType'
        workFormat:
          $ref: '#/components/schemas/WorkFormat'
        employmentType:
          $ref: '#/components/schemas/EmploymentType'
        level:
          $ref: '#/components/schemas/Level'
        cityId:
          type: integer
          format: int64
          nullable: true
        addressId:
          type: integer
          format: int64
          nullable: true
        salaryFrom:
          type: integer
          minimum: 0
          nullable: true
        salaryTo:
          type: integer
          minimum: 0
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        eventDate:
          type: string
          format: date-time
          nullable: true
        tagIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        contactInfo:
          type: object
          required:
          - email
          properties:
            email:
              type: string
              format: email
            phone:
              type: string
              nullable: true
            telegram:
              type: string
              nullable: true
            contactPerson:
              type: string
              nullable: true
          additionalProperties: true
        resourceLinks:
          type: array
          items:
            type: string
            format: uri
        media:
          type: array
          items:
            type: string
            format: uri
      allOf:
      - if:
          properties:
            workFormat:
              const: remote
          required:
          - workFormat
        then:
          required:
          - cityId
      - if:
          properties:
            workFormat:
              enum:
              - office
              - hybrid
          required:
          - workFormat
        then:
          required:
          - addressId
      - if:
          properties:
            opportunityType:
              const: event
          required:
          - opportunityType
        then:
          required:
          - eventDate
      - if:
          properties:
            opportunityType:
              enum:
              - vacancy
              - internship
              - mentoring
          required:
          - opportunityType
        then:
          required:
          - expiresAt
    OpportunityUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        shortDescription:
          type: string
          minLength: 10
          maxLength: 1000
        fullDescription:
          type: string
          minLength: 30
        workFormat:
          $ref: '#/components/schemas/WorkFormat'
        employmentType:
          $ref: '#/components/schemas/EmploymentType'
        level:
          $ref: '#/components/schemas/Level'
        cityId:
          type: integer
          format: int64
          nullable: true
        addressId:
          type: integer
          format: int64
          nullable: true
        salaryFrom:
          type: integer
          minimum: 0
          nullable: true
        salaryTo:
          type: integer
          minimum: 0
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        eventDate:
          type: string
          format: date-time
          nullable: true
        tagIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        contactInfo:
          type: object
          properties:
            email:
              type: string
              format: email
            phone:
              type: string
              nullable: true
            telegram:
              type: string
              nullable: true
            contactPerson:
              type: string
              nullable: true
          additionalProperties: true
        resourceLinks:
          type: array
          items:
            type: string
            format: uri
        media:
          type: array
          items:
            type: string
            format: uri
    OpportunityStatusUpdateRequest:
      type: object
      required:
      - publicationStatus
      properties:
        publicationStatus:
          $ref: '#/components/schemas/PublicationStatus'
    Application:
      type: object
      required:
      - id
      - opportunityId
      - applicantProfileId
      - status
      properties:
        id:
          type: integer
          format: int64
        opportunityId:
          type: integer
          format: int64
        applicantProfileId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        coverLetter:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApplicationCreateRequest:
      type: object
      properties:
        coverLetter:
          type: string
          maxLength: 5000
    ApplicationStatusUpdateRequest:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'
    Tag:
      type: object
      required:
      - id
      - name
      - tagType
      - isSystem
      - isActive
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tagType:
          $ref: '#/components/schemas/TagType'
        isSystem:
          type: boolean
        isActive:
          type: boolean
    TagCreateRequest:
      type: object
      required:
      - name
      - tagType
      properties:
        name:
          type: string
        tagType:
          $ref: '#/components/schemas/TagType'
    Contact:
      type: object
      required:
      - id
      - requesterUserId
      - addresseeUserId
      - status
      properties:
        id:
          type: integer
          format: int64
        requesterUserId:
          type: integer
          format: int64
        addresseeUserId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ContactStatus'
    ContactRequestCreate:
      type: object
      required:
      - addresseeUserId
      properties:
        addresseeUserId:
          type: integer
          format: int64
    ContactStatusUpdateRequest:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/ContactStatus'
    VerificationRequest:
      type: object
      required:
      - id
      - employerProfileId
      - status
      - submittedAt
      properties:
        id:
          type: integer
          format: int64
        employerProfileId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/VerificationRequestStatus'
        comment:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        reviewedByCuratorId:
          type: integer
          format: int64
          nullable: true
    VerificationRequestUpdateRequest:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/VerificationRequestStatus'
        comment:
          type: string
    CreateCuratorRequest:
      type: object
      required:
      - email
      - password
      - displayName
      - fullName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
        fullName:
          type: string
        position:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - curator
          - admin_curator
          default: curator
    RefreshTokenRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    LogoutRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    MapPoint:
      type: object
      required:
      - cityName
      properties:
        cityId:
          type: integer
          format: int64
          nullable: true
        cityName:
          type: string
        addressId:
          type: integer
          format: int64
          nullable: true
        addressText:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
    ApplicantProfileView:
      type: object
      required:
      - id
      - userId
      - fullName
      - visibilityScope
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        fullName:
          type: string
        university:
          type: string
          nullable: true
        studyCourse:
          type: string
          nullable: true
        graduationYear:
          type: integer
          nullable: true
        about:
          type: string
          nullable: true
        resumeText:
          type: string
          nullable: true
        portfolioLinks:
          type: array
          items:
            type: string
            format: uri
        skills:
          type: array
          items:
            type: string
        visibilityScope:
          type: string
          enum:
          - owner
          - employer_application_access
          - contact
          - all_authorized
          - hidden
        careerInterestsVisible:
          type: boolean
    CareerInterestType:
      type: string
      enum:
      - applied
      - favorited
    CareerInterest:
      type: object
      required:
      - type
      - opportunityId
      - opportunityTitle
      - opportunityType
      - createdAt
      properties:
        type:
          $ref: '#/components/schemas/CareerInterestType'
        opportunityId:
          type: integer
          format: int64
        opportunityTitle:
          type: string
        opportunityType:
          $ref: '#/components/schemas/OpportunityType'
        employerName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    EmployerOwnOpportunityStatus:
      type: string
      enum:
      - draft
      - pending_moderation
      - active
      - planned
      - closed
      - rejected
    EmployerApplication:
      type: object
      required:
      - id
      - opportunityId
      - applicantProfileId
      - status
      properties:
        id:
          type: integer
          format: int64
        opportunityId:
          type: integer
          format: int64
        applicantProfileId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        coverLetter:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        applicant:
          type: object
          required:
          - id
          - fullName
          properties:
            id:
              type: integer
              format: int64
            fullName:
              type: string
            university:
              type: string
              nullable: true
            studyCourse:
              type: string
              nullable: true
            graduationYear:
              type: integer
              nullable: true
            about:
              type: string
              nullable: true
    PaginatedEmployerApplicationList:
      type: object
      required:
      - items
      - page
      - perPage
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EmployerApplication'
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
    VerificationRequestCreateRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 2000
    CuratorEmployerProfileUpdateRequest:
      type: object
      properties:
        companyName:
          type: string
        shortDescription:
          type: string
        industry:
          type: string
        websiteUrl:
          type: string
          format: uri
        socialLinks:
          type: array
          items:
            type: string
            format: uri
        officePhotos:
          type: array
          items:
            type: string
            format: uri
        promoVideoUrl:
          type: string
          format: uri
        cityId:
          type: integer
          format: int64
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        verificationComment:
          type: string
        verifiedAt:
          type: string
          format: date-time
          nullable: true
    CuratorApplicantProfileUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        university:
          type: string
        studyCourse:
          type: string
        graduationYear:
          type: integer
        about:
          type: string
        resumeText:
          type: string
        portfolioLinks:
          type: array
          items:
            type: string
            format: uri
    CuratorOpportunityUpdateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        shortDescription:
          type: string
          minLength: 10
          maxLength: 1000
        fullDescription:
          type: string
          minLength: 30
        workFormat:
          $ref: '#/components/schemas/WorkFormat'
        employmentType:
          $ref: '#/components/schemas/EmploymentType'
        level:
          $ref: '#/components/schemas/Level'
        cityId:
          type: integer
          format: int64
          nullable: true
        addressId:
          type: integer
          format: int64
          nullable: true
        salaryFrom:
          type: integer
          minimum: 0
          nullable: true
        salaryTo:
          type: integer
          minimum: 0
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        eventDate:
          type: string
          format: date-time
          nullable: true
        tagIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
        contactInfo:
          type: object
          properties:
            email:
              type: string
              format: email
            phone:
              type: string
              nullable: true
            telegram:
              type: string
              nullable: true
            contactPerson:
              type: string
              nullable: true
          additionalProperties: true
        resourceLinks:
          type: array
          items:
            type: string
            format: uri
        media:
          type: array
          items:
            type: string
            format: uri
        publicationStatus:
          $ref: '#/components/schemas/PublicationStatus'
    EventRegistration:
      type: object
      required:
      - id
      - opportunityId
      - applicantProfileId
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
          format: int64
        opportunityId:
          type: integer
          format: int64
        applicantProfileId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/EventRegistrationStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
    EventRegistrationListItem:
      type: object
      required:
      - registration
      - opportunity
      properties:
        registration:
          $ref: '#/components/schemas/EventRegistration'
        opportunity:
          $ref: '#/components/schemas/OpportunitySummary'
    PaginatedEventRegistrationList:
      type: object
      required:
      - items
      - page
      - perPage
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventRegistrationListItem'
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
